<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting...</title>
  </head>

  <body>
    <style>
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 0.3;
        }
        50% {
          opacity: 1;
        }
      }
    </style>

    <div
      style="
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        gap: 2rem;
        font-family: sans-serif;
        animation: fadeIn 0.5s ease;
      "
    >
      <div
        style="
          width: 40px;
          height: 40px;
          border: 2px solid #e0e0e0;
          border-top-color: #888;
          border-radius: 50%;
          animation: spin 0.9s linear infinite;
        "
      ></div>

      <div style="text-align: center">
        <p
          style="
            margin: 0 0 6px;
            font-size: 17px;
            font-weight: 500;
            color: #111;
          "
        >
          Redirecting you
        </p>
        <p style="margin: 0; font-size: 13px; color: #888">
          To your Personal Server... (if it doesn't load, the server is likely
          down)
        </p>
      </div>

      <div style="display: flex; gap: 6px; align-items: center">
        <div
          style="
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #bbb;
            animation: pulse 1.4s ease-in-out infinite;
          "
        ></div>
        <div
          style="
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #bbb;
            animation: pulse 1.4s ease-in-out 0.2s infinite;
          "
        ></div>
        <div
          style="
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #bbb;
            animation: pulse 1.4s ease-in-out 0.4s infinite;
          "
        ></div>
      </div>
    </div>

    <script>
      fetch("../tunnels.json")
        .then((res) => res.json())
        .then(async (data) => {
          try {
            const response = await fetch(data.personal.public_url, {
              method: "HEAD",
            });
            if (response.ok) {
              window.location.href = data.personal.public_url;
            } else {
              window.location.href = "personal-server/server-down.html";
              console.error("Personal server is not reachable.");
            }
          } catch (err) {
            window.location.href = "personal-server/server-down.html";
            console.error("Personal server is not reachable.");
          }
        })
        .catch(() => {
          document.body.innerHTML = "Failed to load redirect.";
        });
    </script>
  </body>
</html>
