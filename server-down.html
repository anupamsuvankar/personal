        --ok: #2f9e6b;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;

        color: var(--ink);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        line-height: 1.5;
      }
      .ticket {
        width: 100%;
        max-width: 500px;
        padding: 36px 32px 28px;
        background: var(--card);
        border-radius: 14px;
        border: 2px dashed var(--line);
        box-shadow: 0 0 0 8px var(--card);
      }
      h1 { margin: 0 0 6px; font-size: clamp(2rem, 7vw, 2.6rem); font-weight: 750; letter-spacing: -.025em; line-height: 1.1; }
      .sub { margin: 0 0 26px; color: var(--muted); }

      ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 16px; }
      li { display: flex; gap: 14px; align-items: flex-start; }
      .box {
        flex: none;
        width: 22px; height: 22px;
        margin-top: 2px;
        border: 2px solid var(--line);
        border-radius: 6px;
      }
      .done .box { background: var(--ok); border-color: var(--ok); position: relative; }
      .done .box::after {
        content: "";
        position: absolute;
        left: 6px; top: 2px;
        width: 6px; height: 11px;
        border: solid #fff;
        border-width: 0 2.5px 2.5px 0;
        transform: rotate(45deg);
      }
      strong { display: block; font-weight: 650; }
      li span { color: var(--muted); font-size: .95rem; }

      .foot { margin: 28px 0 0; padding-top: 16px; border-top: 1px dashed var(--line); font: 13px ui-monospace, "SF Mono", Menlo, Consolas, monospace; color: var(--muted); }

      </head>
      <body>
        <main class="ticket">
          <h1 style="color: red">Server down.</h1>
          <p class="sub">Yep, it’s down. We know. You know. Here’s a checklist anyway.</p>

          <ul>
            <li class="done"><i class="box"></i><div><strong>Check your internet connection</strong><span>It’s fine. You’re reading this.</span></div></li>
            <li class="done"><i class="box"></i><div><strong>Refresh the page</strong><span>Go on. We’ll wait.</span></div></li>

            <li><i class="box"></i><div><strong>Accept that it’s the server, not you</strong><span>Take your time.</span></div></li>
          </ul>

          <p class="foot">Status: 503, <span style="color: red">server down</span>. It really isn’t you.</p>
        </main>
      </body>

    <script type="text/plain" data-design="loading">
      <!DOCTYPE html>
      <html lang="en">
      <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Server down</title>
      <link rel="icon" href="data:,">
      <style>
      :root {
        --bg: #17142b;
        --track: #2b2650;
        --fill: #9b8cff;
        --text: #ece9ff;
        --muted: #9a96c4;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);

        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        line-height: 1.55;
      }
      main { width: 100%; max-width: 440px; }
      h1 { margin: 0 0 22px; font-size: clamp(1.6rem, 5vw, 2.1rem); font-weight: 650; letter-spacing: -.015em; }

      .bar { height: 12px; border-radius: 6px; background: var(--track); overflow: hidden; }
      .fill { height: 100%; width: 0; border-radius: 6px; background: var(--fill); animation: load 5s cubic-bezier(.2, .7, .3, 1) forwards; }
      @keyframes load { to { width: 99%; } }
      .pct { margin: 8px 0 0; text-align: right; font: 13px ui-monospace, "SF Mono", Menlo, Consolas, monospace; color: var(--muted); }

      .msgs { position: relative; height: 1.7em; margin-top: 14px; }
      .msgs span { position: absolute; inset: 0 auto auto 0; opacity: 0; color: var(--text); animation: msg 16s infinite; }
      .msgs span:nth-child(2) { animation-delay: 4s; }
      .msgs span:nth-child(3) { animation-delay: 8s; }
      .msgs span:nth-child(4) { animation-delay: 12s; }
      @keyframes msg { 0% { opacity: 0; } 4% { opacity: 1; } 22% { opacity: 1; } 26%, 100% { opacity: 0; } }

      .truth { margin: 40px 0 0; padding-top: 18px; border-top: 1px solid var(--track); color: var(--muted); }

      @media (prefers-reduced-motion: reduce) {
        .fill { animation: none; width: 99%; }
        .msgs span { animation: none; opacity: 0; }
        .msgs span:first-child { opacity: 1; }
      }
      .badge { display: inline-block; margin-bottom: 14px; padding: 3px 12px; border-radius: 999px; background: #ff6b81; color: #17142b; font-weight: 700; font-size: .85rem; }
      </style>
      </head>
      <body>
      <main>
        <div class="badge">Server down</div>
        <h1>Loading your page…</h1>
        <div class="bar" role="img" aria-label="Progress bar stuck at 99 percent"><div class="fill"></div></div>

        <div class="msgs">
          <span>Contacting the server…</span>
          <span>The server is thinking about it…</span>
          <span>Still 99%. Impressive commitment.</span>
          <span>This is the part where we stop pretending.</span>

        <p class="truth">Just kidding. The server is down and isn’t responding. The bar is only here for morale.</p>

    <script type="text/plain" data-design="receipt">
      <!DOCTYPE html>
      <html lang="en">
      <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Server down</title>
      <link rel="icon" href="data:,">
      <style>
      :root {
        --wall: #cfd6df;
        --paper: #fffefb;
        --ink: #23262d;
        --muted: #747a86;
        --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Courier New", monospace;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px 20px;
        background: var(--wall);
        color: var(--ink);
        font: 14px/1.6 var(--mono);
      }
      .receipt {
        width: 100%;
        max-width: 340px;
        filter: drop-shadow(0 14px 18px rgba(35, 38, 45, .25));
        animation: print 1.8s steps(18) both;
      }
      @keyframes print { from { clip-path: inset(0 0 100% 0); } to { clip-path: inset(0 0 0 0); } }

      .edge { height: 9px; background-color: var(--paper); background-size: 14px 100%; }
      .edge.top { background-image: radial-gradient(circle at 7px 0, var(--wall) 5px, transparent 5.5px); }
      .edge.bottom { background-image: radial-gradient(circle at 7px 100%, var(--wall) 5px, transparent 5.5px); }
      .body { padding: 14px 24px 18px; background: var(--paper); }

      .c { text-align: center; }
      h1 { margin: 0; font-size: 1.15rem; font-weight: 700; }
      .dim { color: var(--muted); }
      hr { margin: 14px 0; border: 0; border-top: 1px dashed var(--muted); }

      .item { display: flex; align-items: baseline; gap: 6px; }
      .item .dots { flex: 1; min-width: 12px; border-bottom: 1px dotted var(--muted); transform: translateY(-3px); }
      .item b { font-weight: 700; text-align: right; }
      .total { font-weight: 700; font-size: 1.05rem; }

      .bars {
        height: 50px;
        width: 78%;
        margin: 18px auto 6px;
        background: repeating-linear-gradient(90deg, var(--ink) 0 2px, transparent 2px 4px, var(--ink) 4px 5px, transparent 5px 8px, var(--ink) 8px 11px, transparent 11px 13px);
      }

      @media (prefers-reduced-motion: reduce) { .receipt { animation: none; } }
      .down { margin: 8px 0 2px; font-weight: 700; font-size: 1.05rem; letter-spacing: .08em; }
      </style>
      </head>
      <body>
        <main class="receipt">
          <div class="edge top"></div>
          <div class="body">
            <div class="c">
              <h1>Server Co.</h1>
              <div class="down" style="color: red">** SERVER DOWN **</div>
              <div class="dim">Thank you for visiting</div>
              <div class="dim">Date: today, probably</div>
            </div>
            <hr>

            <div class="item"><span>1 × Your page</span><span class="dots"></span><b>Out of stock</b></div>
            <div class="item"><span>1 × Our server</span><span class="dots"></span><b>On break</b></div>
            <div class="item"><span>1 × Excuse</span><span class="dots"></span><b>Not you</b></div>
            <hr>

            <div class="item total"><span>Total</span><span class="dots"></span><b>$0.00</b></div>
            <div class="item"><span>Refund</span><span class="dots"></span><b>$0.00</b></div>
            <hr>

            <div class="dim">Returns: please don’t. There is nothing to return.</div>
            <div class="dim">Your cashier today: nobody.</div>

            <div class="bars" aria-hidden="true"></div>
            <div class="c dim">503 503 503</div>
            <div class="c" style="margin-top:12px">Please come again. Later.</div>
          </div>
          <div class="edge bottom"></div>
        </main>
      </body>
      </html>
    </script>

    <script>
      (function () {
        var nodes = document.querySelectorAll(
          'script[type="text/plain"][data-design]',
        );
        var designs = {},
          names = [];
        for (var i = 0; i < nodes.length; i++) {
          designs[nodes[i].getAttribute("data-design")] = nodes[i].textContent;
          names.push(nodes[i].getAttribute("data-design"));
        }

        // ?design=receipt forces one design (handy for previewing)
        var forced = new URLSearchParams(location.search).get("design");
        var pick;
        if (forced && designs.hasOwnProperty(forced)) {
          pick = forced;
        } else {
          var KEY = "serverdown:last",
            last = null;
          try {
            last = localStorage.getItem(KEY);
          } catch (e) {}
          var pool = names.filter(function (n) {
            return n !== last;
          });
          if (!pool.length) pool = names;
          pick = pool[Math.floor(Math.random() * pool.length)];
          try {
            localStorage.setItem(KEY, pick);
          } catch (e) {}
        }

        var doc = new DOMParser().parseFromString(designs[pick], "text/html");
        document.title = doc.title;
        var styles = doc.head.querySelectorAll("style");
        for (var j = 0; j < styles.length; j++) {
          document.head.appendChild(document.importNode(styles[j], true));
        }
        document.body.replaceWith(document.importNode(doc.body, true));
      })();
    </script>
  </body>
